name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_WORKER: depot-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core, CLI, data and web app
        run: |
          pnpm --filter @depot/core build
          pnpm --filter @depot/cli build
          pnpm --filter @depot/cli start
          node scripts/copy-data.mjs
          pnpm --filter @depot/web build

      - name: Write preview wrangler config
        run: |
          set -euo pipefail
          cat > wrangler.preview.jsonc <<EOF
          {
            "name": "${PREVIEW_WORKER}",
            "compatibility_date": "2026-08-01",
            "main": "scripts/preview-worker.ts",
            "assets": {
              "binding": "ASSETS",
              "directory": "packages/web/dist",
              "not_found_handling": "single-page-application"
            }
          }
          EOF

      - name: Deploy worker
        id: deploy
        run: |
          set -euo pipefail
          output=$(pnpm exec wrangler deploy --config wrangler.preview.jsonc 2>&1)
          echo "$output"
          url=$(echo "$output" | grep -Eo 'https://[^[:space:]]+workers\.dev' | head -n1 || true)
          if [ -z "$url" ]; then
            url="https://${PREVIEW_WORKER}.fjlaubscher.workers.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const worker = process.env.PREVIEW_WORKER;
            const marker = `<!-- depot-preview pr=${pr} -->`;
            const body = [
              marker,
              `**Preview:** ${url}`,
              '',
              `\`${sha}\` · \`${worker}\` · same OG rewrite as prod (`functions/[[path]].ts`).`,
              '',
              '_Torn down when this PR closes._'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes('<!-- depot-preview')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body
              });
            }

  preview-cleanup:
    name: Preview cleanup
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_WORKER: depot-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete preview worker
        run: pnpm exec wrangler delete --name "$PREVIEW_WORKER" --force 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const worker = process.env.PREVIEW_WORKER;
            const marker = `<!-- depot-preview pr=${pr} -->`;
            const body = [
              marker,
              `**Preview torn down.** \`${worker}\` deleted.`,
              '',
              '_PR closed — no further preview deploys._'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes('<!-- depot-preview')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            }
