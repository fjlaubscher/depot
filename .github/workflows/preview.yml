name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core, CLI, data and web app
        run: |
          pnpm --filter @depot/core build
          pnpm --filter @depot/cli build
          pnpm --filter @depot/cli start
          node scripts/copy-data.mjs
          pnpm --filter @depot/web build

      - name: Deploy Pages preview
        id: deploy
        run: |
          set -euo pipefail
          output=$(npx wrangler pages deploy packages/web/dist --project-name depot --branch "$PREVIEW_BRANCH" 2>&1)
          echo "$output"
          url=$(echo "$output" | grep -Eo 'https://[^[:space:]]+pages\.dev' | head -n1 || true)
          if [ -z "$url" ]; then
            url="https://${PREVIEW_BRANCH}.depot.pages.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const branch = process.env.PREVIEW_BRANCH;
            const alias = `https://${branch}.depot.pages.dev`;
            const marker = `<!-- depot-preview pr=${pr} -->`;
            const body = [
              marker,
              `**Preview:** ${alias}`,
              '',
              'Cloudflare Pages preview (static app + `functions/[[path]].ts` OG rewrite).',
              `\`${sha}\` · branch \`${branch}\` · deployment ${url}`,
              '',
              '_Replaced on each push. Alias stays `pr-<n>.depot.pages.dev`._'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes('<!-- depot-preview')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body
              });
            }

  preview-closed:
    name: Mark preview stale
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const alias = `https://${process.env.PREVIEW_BRANCH}.depot.pages.dev`;
            const marker = `<!-- depot-preview pr=${pr} -->`;
            const body = [
              marker,
              `**Preview closed.** ${alias} may linger on Cloudflare until the next deploy overwrites that branch.`,
              '',
              '_PR closed — no further preview deploys._'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes('<!-- depot-preview')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            }
