name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wahapedia version
        id: wahapedia
        run: echo "hash=$(bash scripts/wahapedia-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache Wahapedia CSVs
        uses: actions/cache@v4
        with:
          path: packages/cli/dist/source_data
          key: wahapedia-${{ steps.wahapedia.outputs.hash }}
          restore-keys: |
            wahapedia-

      - name: Build core, CLI, data and web app
        run: |
          pnpm --filter @depot/core build
          pnpm --filter @depot/cli build
          pnpm --filter @depot/cli start
          node scripts/copy-data.mjs
          pnpm --filter @depot/web build

      - name: Deploy Pages preview
        id: deploy
        run: |
          set +e
          output=$(pnpm exec wrangler pages deploy packages/web/dist --project-name depot --branch "$PREVIEW_BRANCH" --commit-dirty=true --commit-hash "${{ github.event.pull_request.head.sha }}" 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          url=$(echo "$output" | grep -Eo "https://${PREVIEW_BRANCH}[.][^[:space:]]+[.]pages[.]dev" | head -n1 || true)
          if [ -z "$url" ]; then
            url=$(echo "$output" | grep -Eo 'https://[^[:space:]]+\.pages\.dev' | head -n1 || true)
          fi
          if [ -z "$url" ]; then
            url="https://${PREVIEW_BRANCH}.depot.pages.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const branch = process.env.PREVIEW_BRANCH;
            const marker = `<!-- depot-preview pr=${pr} -->`;
            const body = [
              marker,
              `**Preview:** ${url}`,
              '',
              `\`${sha}\` · Pages branch \`${branch}\` · same project as prod (\`depot\`).`,
              '',
              '_Updates on each push. Stops when this PR closes._'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes('<!-- depot-preview')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body
              });
            }

  preview-cleanup:
    name: Preview cleanup
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Delete Pages preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');

          const branch = process.env.PREVIEW_BRANCH;
          if (!branch || !/^pr-\d+$/.test(branch)) {
            console.error(`Refusing to delete: invalid PREVIEW_BRANCH=${JSON.stringify(branch)}`);
            process.exit(1);
          }

          const npx = (args, opts = {}) => {
            const result = spawnSync('npx', ['--yes', 'wrangler@4', ...args], {
              encoding: 'utf8',
              stdio: opts.stdio ?? ['ignore', 'pipe', 'pipe']
            });
            if (result.status !== 0) {
              const err = (result.stderr || result.stdout || '').trim();
              console.error(err || `wrangler exited ${result.status}`);
              process.exit(result.status ?? 1);
            }
            return result.stdout || '';
          };

          const raw = npx([
            'pages', 'deployment', 'list',
            '--project-name', 'depot',
            '--environment', 'preview',
            '--json'
          ]);

          const start = raw.indexOf('[');
          const end = raw.lastIndexOf(']');
          const deployments = start === -1 || end === -1 ? [] : JSON.parse(raw.slice(start, end + 1));
          if (!Array.isArray(deployments)) {
            console.log('No preview deployments listed; nothing to delete.');
            process.exit(0);
          }

          const branchOf = (d) =>
            d.Branch ?? d.branch ?? d.deployment_trigger?.metadata?.branch ?? '';
          const idOf = (d) => d.Id ?? d.id ?? '';

          // Strict: only this PR's preview branch. Never production / main / other branches.
          const matches = deployments.filter((d) => branchOf(d) === branch);
          if (matches.length === 0) {
            console.log(`No preview deployments for branch ${branch}.`);
            process.exit(0);
          }

          for (const d of matches) {
            const id = idOf(d);
            if (!id || !/^[0-9a-f-]{36}$/i.test(id)) {
              console.log(`Skipping deployment with unexpected id: ${JSON.stringify(id)}`);
              continue;
            }
            console.log(`Deleting deployment ${id} (branch ${branchOf(d)})`);
            npx(
              ['pages', 'deployment', 'delete', id, '--project-name', 'depot', '--force'],
              { stdio: 'inherit' }
            );
          }
          NODE

      - name: Update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const branch = process.env.PREVIEW_BRANCH;
            const marker = `<!-- depot-preview pr=${pr} -->`;
            const body = [
              marker,
              '**Preview deleted.**',
              '',
              `_PR closed — Pages branch \`${branch}\` removed._`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes('<!-- depot-preview')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            }
