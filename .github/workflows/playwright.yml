name: Playwright E2E

# E2E is the priciest job in the repo, so it only runs on main. Run it by hand
# from the Actions tab when a branch needs the check before merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wahapedia version
        id: wahapedia
        run: echo "hash=$(bash scripts/wahapedia-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache Wahapedia CSVs
        uses: actions/cache@v4
        with:
          path: packages/cli/dist/source_data
          key: wahapedia-${{ steps.wahapedia.outputs.hash }}
          restore-keys: |
            wahapedia-

      - name: Install Playwright (workspace)
        run: pnpm --filter @depot/web exec playwright install --with-deps chromium

      - name: Build core + CLI and generate data
        run: |
          pnpm --filter @depot/core build
          pnpm --filter @depot/cli build
          pnpm --filter @depot/cli start
          node scripts/copy-data.mjs

      - name: Run Playwright tests
        run: pnpm --filter @depot/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 14
